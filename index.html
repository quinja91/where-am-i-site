<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Am I?</title>
<meta name="description" content="Where Am I? — a new game, in development.">

<meta property="og:title" content="Where Am I?">
<meta property="og:description" content="A new game, in development.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://where-am-i-game.com">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  /* ------------------------------------------------------------------
     "Departure board" -- the same visual language as the app itself
     (src/design/tokens.ts). Cool wayfinding: near-neutral paper,
     near-black ink, a single high-visibility signal accent. No cards,
     no rounded corners, no gradients. Paper is the board in daylight;
     Darkroom is the same board lit from behind.

     This is deliberately a NAME PLATE and nothing more. It says the
     game exists and gives no account of what it does -- see the repo
     README before adding anything to it.
     ------------------------------------------------------------------ */

  :root {
    --bg:         #F4F5F3;
    --ink:        #16181A;
    --ink-muted:  #3F4448;
    --ink-faint:  #63686D;
    --rule:       rgba(22, 24, 26, 0.14);
    --accent:     #F5B301;

    --display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --mono: 'Spline Sans Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:         #101214;
      --ink:        #ECEEF0;
      --ink-muted:  #B6BBC0;
      --ink-faint:  #84898E;
      --rule:       rgba(236, 238, 240, 0.16);
      --accent:     #FFD400;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }

  .sheet {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* An uppercase micro-label, the way the app annotates a screen. */
  .label {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0;
  }

  .wordmark {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(40px, 12vw, 76px);
    line-height: 1.06;
    letter-spacing: 0.5px;
    margin: 14px 0 0;
    color: var(--ink);
  }

  /* The signal stripe. The single piece of colour on the page, and the
     only thing standing in for all the content that is deliberately
     not here. */
  .stripe {
    width: 96px;
    height: 8px;
    background: var(--accent);
    margin: 28px 0 0;
  }

  .line {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(16px, 4.4vw, 19px);
    line-height: 1.5;
    color: var(--ink-muted);
    margin: 28px 0 0;
    max-width: 34ch;
  }

  footer {
    padding: 0 24px 32px;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  .footer-inner {
    border-top: 1px solid var(--rule);
    padding-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 24px;
    justify-content: space-between;
  }

  footer p { margin: 0; }
</style>
</head>
<body>

  <main class="sheet">
    <p class="label">In development</p>
    <h1 class="wordmark">WHERE AM I?</h1>
    <div class="stripe"></div>
    <p class="line">A new game for iOS, Android and the web. Coming soon.</p>
  </main>

  <footer>
    <div class="footer-inner">
      <p class="label">An independent game</p>
      <p class="label">where-am-i-game.com</p>
    </div>
  </footer>

</body>
</html>
